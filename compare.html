<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File Compare</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; }
  label { display: block; margin-top: 16px; font-weight: bold; }
  input[type="file"] { margin-top: 6px; }
  button { margin-top: 20px; padding: 8px 20px; font-size: 14px; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  pre { background: #f4f4f4; padding: 12px; margin-top: 20px; white-space: pre-wrap; word-break: break-word; max-height: 400px; overflow-y: auto; }
  #status { margin-top: 10px; color: #2a7a2a; }
</style>
</head>
<body>

<h1>File Compare</h1>
<p>Pick an old file and a new file, click Compare. Comparison is by line content, ignoring order.</p>

<label for="oldFile">Old file</label>
<input type="file" id="oldFile" accept=".txt">

<label for="newFile">New file</label>
<input type="file" id="newFile" accept=".txt">

<br>
<button id="compareBtn" disabled>Compare</button>
<div id="status"></div>
<pre id="output"></pre>

<script>
const oldFileInput = document.getElementById('oldFile');
const newFileInput = document.getElementById('newFile');
const compareBtn = document.getElementById('compareBtn');
const output = document.getElementById('output');
const status = document.getElementById('status');

function updateButtonState() {
  compareBtn.disabled = !(oldFileInput.files.length && newFileInput.files.length);
}
oldFileInput.addEventListener('change', updateButtonState);
newFileInput.addEventListener('change', updateButtonState);

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}

function splitLines(text) {
  return text.split(/\r\n|\r|\n/).filter((_, i, arr) => !(i === arr.length - 1 && arr[i] === ''));
}

function countLines(lines) {
  const counts = new Map();
  for (const line of lines) {
    counts.set(line, (counts.get(line) || 0) + 1);
  }
  return counts;
}

function subtractCounts(a, b) {
  const result = new Map();
  for (const [line, n] of a) {
    const remaining = n - (b.get(line) || 0);
    if (remaining > 0) result.set(line, remaining);
  }
  return result;
}

function intersectCounts(a, b) {
  let total = 0;
  for (const [line, n] of a) {
    total += Math.min(n, b.get(line) || 0);
  }
  return total;
}

function sumCounts(counts) {
  let total = 0;
  for (const n of counts.values()) total += n;
  return total;
}

function buildReportSection(title, counts) {
  const lines = [`${title} (${sumCounts(counts)} line(s)):`];
  for (const [line, n] of counts) {
    for (let i = 0; i < n; i++) lines.push(`  ${line}`);
  }
  return lines;
}

compareBtn.addEventListener('click', async () => {
  status.textContent = '';
  output.textContent = '';

  const oldFile = oldFileInput.files[0];
  const newFile = newFileInput.files[0];

  const [oldText, newText] = await Promise.all([readFileAsText(oldFile), readFileAsText(newFile)]);

  const oldCounts = countLines(splitLines(oldText));
  const newCounts = countLines(splitLines(newText));

  const onlyOld = subtractCounts(oldCounts, newCounts);
  const onlyNew = subtractCounts(newCounts, oldCounts);
  const commonTotal = intersectCounts(oldCounts, newCounts);

  const reportLines = [];
  reportLines.push(...buildReportSection(`Only in ${oldFile.name}`, onlyOld));
  reportLines.push('');
  reportLines.push(...buildReportSection(`Only in ${newFile.name}`, onlyNew));
  reportLines.push('');
  reportLines.push(`Common to both: ${commonTotal} line(s)`);
  reportLines.push('');
  const diffTotal = sumCounts(onlyOld) + sumCounts(onlyNew);
  if (diffTotal === 0) {
    reportLines.push('Files contain identical lines (order ignored).');
  } else {
    reportLines.push(`${diffTotal} differing line(s) found.`);
  }

  const reportText = reportLines.join('\n') + '\n';
  output.textContent = reportText;

  const blob = new Blob([reportText], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'comparison_result.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  status.textContent = 'comparison_result.txt downloaded.';
});
</script>

</body>
</html>
